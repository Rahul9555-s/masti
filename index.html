<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Special Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1px));
            gap: 25px;
            width: 100%;
            max-width: 900px;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            text-align: center;
            text-decoration: none;
            color: #333;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 2px solid transparent;
            display: block;
            min-width: 250px;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            border-color: #ff9a9e;
        }

        .card-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ff4757;
        }

        .card-desc {
            font-size: 0.95rem;
            color: #7f8c8d;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>✨ Our Special Space ✨</h1>
    
    <div class="dashboard">
        <!-- Card 1: Sonia Ji ka page -->
        <a href="masti.html" class="card">
            <div class="card-icon">🌸</div>
            <div class="card-title">A Smile for Malkin</div>
            <div class="card-desc">Click here to see the special surprise page made for Sonia Ji.</div>
        </a>

        <!-- Card 2: Future pages ke liye placeholder -->
        <a href="#" class="card">
            <div class="card-icon">🚧</div>
            <div class="card-title">Coming Soon</div>
            <div class="card-desc">More beautiful memories and pages will be added here soon.</div>
        </a>
    </div>

</body>
</html>
