<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Smile for Sonia Ji</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevents scrollbars from falling emojis */
        }
        
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            animation: float 3s ease-in-out infinite;
            z-index: 10; /* Keeps card above the falling emojis */
            position: relative;
        }

        h1 {
            color: #ff4757;
            margin-bottom: 20px;
            font-size: 28px;
        }

        p {
            color: #57606f;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .smile {
            font-size: 60px;
            margin: 20px 0;
            animation: pulse 2s infinite;
        }

        .highlight {
            color: #ff6b81;
            font-weight: bold;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #ff4757;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .button:hover {
            background-color: #ff6b81;
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Falling Emoji Styles */
        .falling-emoji {
            position: fixed;
            top: -50px;
            pointer-events: none; /* Allows clicking through the emojis */
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Dearest Sonia Ji 🌸</h1>
        <div class="smile">😊✨</div>
        <p>I heard that my favorite <span class="highlight">Malkin</span> is feeling a little sad today.</p>
        <p>Just wanted to send this little note to remind you how absolutely wonderful you are! Aapki ek smile pure din ko bright kar deti hai.</p>
        <p>Tension ko chodiye aur jaldi se ek pyari si smile dijiye!</p>
        <button class="button" onclick="burstMoreEmojis()">Click for Magic</button>
    </div>

    <script>
        const emojis = ['🌸', '🌺', '🌻', '💖', '❤️', '💕', '😊', '🥰', '✨'];

        function createFallingEmoji() {
            const emoji = document.createElement('div');
            emoji.classList.add('falling-emoji');
            
            // Random emoji from the list
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Random positioning and sizing
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.fontSize = Math.random() * 20 + 20 + 'px'; // Size between 20px and 40px
            
            // Random fall duration between 3 and 6 seconds
            const duration = Math.random() * 3 + 3; 
            emoji.style.animationDuration = duration + 's';
            
            document.body.appendChild(emoji);

            // Remove the emoji after it falls to keep the page clean
            setTimeout(() => {
                emoji.remove();
            }, duration * 1000);
        }

        // Create a new falling emoji every 300 milliseconds
        setInterval(createFallingEmoji, 300);

        // Extra burst of emojis when she clicks the button!
        function burstMoreEmojis() {
            for(let i = 0; i < 20; i++) {
                setTimeout(createFallingEmoji, i * 50);
            }
            alert('Yay! Keep smiling Sonia Ji! 🌟💖🌸');
        }
    </script>
</body>
</html>
